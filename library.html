<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Библиотека | University Management System</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #4f46e5;
            --primary-dark: #4338ca;
            --primary-light: #818cf8;
            --primary-bg: #eef2ff;
            --bg: #f8fafc;
            --text: #0f172a;
            --text-light: #475569;
            --white: #ffffff;
            --shadow: 0 20px 60px rgba(0,0,0,0.08);
            --shadow-hover: 0 30px 80px rgba(79,70,229,0.15);
            --radius: 20px;
            --transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            --success: #22c55e;
            --warning: #f59e0b;
            --danger: #ef4444;
            --info: #3b82f6;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        .animate-fadeInUp { animation: fadeInUp 0.8s ease forwards; }
        .animate-fadeIn { animation: fadeIn 0.6s ease forwards; }
        .animate-float { animation: float 3s ease-in-out infinite; }

        /* Skeleton */
        .skeleton {
            background: linear-gradient(90deg, #e2e8f0 25%, #f1f5f9 50%, #e2e8f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 8px;
        }

        .skeleton-card {
            height: 280px;
            border-radius: 12px;
        }

        .skeleton-text { height: 16px; margin: 4px 0; }
        .skeleton-title { height: 24px; width: 70%; margin-bottom: 8px; }

        /* HERO */
        .hero {
            min-height: 100vh;
            background: linear-gradient(135deg, #eef2ff 0%, #e0e7ff 50%, #c7d2fe 100%);
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: -40%;
            right: -10%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(79,70,229,0.08) 0%, transparent 70%);
            border-radius: 50%;
            animation: float 8s ease-in-out infinite;
        }

        .hero::after {
            content: '';
            position: absolute;
            bottom: -30%;
            left: -10%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(99,102,241,0.06) 0%, transparent 70%);
            border-radius: 50%;
            animation: float 6s ease-in-out infinite reverse;
        }

        .grid-bg {
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(rgba(79,70,229,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(79,70,229,0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            z-index: 0;
        }

        .container {
            max-width: 1600px;
            width: 100%;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        /* TOPBAR */
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0 24px;
            border-bottom: 1px solid rgba(226, 232, 240, 0.5);
            margin-bottom: 28px;
            flex-wrap: wrap;
            gap: 12px;
            background: transparent;
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .topbar-left .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: var(--text);
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .topbar-left .logo i {
            font-size: 28px;
            color: var(--primary);
            background: rgba(255,255,255,0.7);
            padding: 10px;
            border-radius: 14px;
            box-shadow: 0 4px 16px rgba(79,70,229,0.1);
        }

        .topbar-left .logo span { color: var(--text); }
        .topbar-left .logo small { 
            font-size: 13px; 
            font-weight: 400; 
            color: var(--text-light);
            margin-left: 4px;
        }

        .topbar-left h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .topbar-left h1 small {
            font-weight: 400;
            font-size: 14px;
            color: var(--text-light);
            margin-left: 8px;
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .topbar-right .icon-btn {
            background: rgba(255,255,255,0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.5);
            color: var(--text-light);
            font-size: 18px;
            cursor: pointer;
            padding: 8px 10px;
            border-radius: 10px;
            transition: var(--transition);
            position: relative;
        }

        .topbar-right .icon-btn:hover {
            background: var(--white);
            color: var(--text);
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(0,0,0,0.06);
        }

        .topbar-right .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: var(--white);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 4px 16px rgba(79,70,229,0.2);
        }

        .topbar-right .avatar:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 24px rgba(79,70,229,0.3);
        }

        /* BREADCRUMBS */
        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--text-light);
            margin-bottom: 20px;
            padding: 8px 16px;
            background: rgba(255,255,255,0.4);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.3);
            flex-wrap: wrap;
        }

        .breadcrumb a {
            color: var(--primary);
            text-decoration: none;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .breadcrumb a:hover {
            text-decoration: underline;
        }

        .breadcrumb span {
            color: var(--text);
            font-weight: 500;
        }

        .breadcrumb .separator {
            color: var(--text-light);
            opacity: 0.5;
        }

        /* GLOBAL SEARCH */
        .global-search {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .global-search input {
            flex: 1;
            min-width: 200px;
            padding: 14px 20px;
            border: 1px solid rgba(226, 232, 240, 0.5);
            border-radius: 12px;
            background: rgba(255,255,255,0.7);
            backdrop-filter: blur(10px);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            transition: var(--transition);
        }

        .global-search input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79,70,229,0.1);
            background: rgba(255,255,255,0.95);
        }

        .global-search select {
            padding: 14px 18px;
            border: 1px solid rgba(226, 232, 240, 0.5);
            border-radius: 12px;
            background: rgba(255,255,255,0.7);
            backdrop-filter: blur(10px);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            cursor: pointer;
            transition: var(--transition);
        }

        .global-search select:focus {
            outline: none;
            border-color: var(--primary);
        }

        /* STATS CARDS */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 16px;
            margin-bottom: 28px;
        }

        .stat-card {
            background: rgba(255,255,255,0.7);
            backdrop-filter: blur(20px);
            border-radius: var(--radius);
            padding: 16px 20px;
            border: 1px solid rgba(255,255,255,0.5);
            box-shadow: var(--shadow);
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover);
            background: rgba(255,255,255,0.9);
        }

        .stat-card .icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }

        .stat-card .icon.blue { background: #dbeafe; color: #2563eb; }
        .stat-card .icon.green { background: #dcfce7; color: #16a34a; }
        .stat-card .icon.purple { background: #ede9fe; color: #7c3aed; }
        .stat-card .icon.orange { background: #fef3c7; color: #d97706; }
        .stat-card .icon.pink { background: #fce7f3; color: #db2777; }
        .stat-card .icon.teal { background: #ccfbf1; color: #0d9488; }

        .stat-card .info h4 {
            font-size: 20px;
            font-weight: 700;
            line-height: 1.2;
        }

        .stat-card .info p {
            font-size: 12px;
            color: var(--text-light);
        }

        /* QUICK FILTERS */
        .quick-filters {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }

        .quick-filters .filter-btn {
            padding: 6px 16px;
            border: 1px solid rgba(226, 232, 240, 0.5);
            border-radius: 50px;
            background: rgba(255,255,255,0.5);
            font-size: 13px;
            cursor: pointer;
            transition: var(--transition);
            font-family: 'Inter', sans-serif;
            color: var(--text-light);
        }

        .quick-filters .filter-btn:hover {
            background: var(--white);
            border-color: var(--primary);
            color: var(--primary);
        }

        .quick-filters .filter-btn.active {
            background: var(--primary);
            color: var(--white);
            border-color: var(--primary);
        }

        /* PAGE HEADER */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .page-header h2 {
            font-size: 28px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .page-header h2 i {
            color: var(--primary);
        }

        .page-header .actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        /* CARD */
        .card {
            background: rgba(255,255,255,0.7);
            backdrop-filter: blur(20px);
            border-radius: var(--radius);
            padding: 24px 28px;
            border: 1px solid rgba(255,255,255,0.5);
            box-shadow: var(--shadow);
            transition: var(--transition);
        }

        .card:hover {
            box-shadow: var(--shadow-hover);
            background: rgba(255,255,255,0.85);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .card-header h3 {
            font-size: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-header h3 i {
            color: var(--primary);
        }

        /* BOOK GRID */
        .book-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .book-card {
            background: var(--white);
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            transition: var(--transition);
            border: 1px solid rgba(226, 232, 240, 0.3);
            position: relative;
        }

        .book-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 40px rgba(0,0,0,0.1);
            border-color: var(--primary-light);
        }

        .book-card .cover {
            width: 100%;
            height: 180px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 56px;
            margin-bottom: 12px;
            background: var(--primary-bg);
            color: var(--primary-light);
            position: relative;
        }

        .book-card .cover .status-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            font-size: 12px;
        }

        .book-card .title {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 4px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .book-card .author {
            font-size: 13px;
            color: var(--text-light);
            margin-bottom: 4px;
        }

        .book-card .isbn {
            font-size: 11px;
            color: var(--text-light);
            font-family: monospace;
        }

        .book-card .meta {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin: 8px 0;
        }

        .book-card .meta .badge {
            font-size: 11px;
            padding: 2px 10px;
        }

        .book-card .stock {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid rgba(226, 232, 240, 0.3);
        }

        .book-card .stock .count {
            font-size: 13px;
            font-weight: 600;
        }

        .book-card .stock .count span {
            color: var(--text-light);
            font-weight: 400;
        }

        .book-card .actions {
            display: flex;
            gap: 4px;
            margin-top: 8px;
        }

        .book-card .actions .btn {
            flex: 1;
            justify-content: center;
            font-size: 12px;
            padding: 4px 8px;
        }

        /* BADGES */
        .badge {
            display: inline-block;
            padding: 3px 12px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-success { background: #dcfce7; color: #166534; }
        .badge-warning { background: #fef3c7; color: #92400e; }
        .badge-danger { background: #fee2e2; color: #991b1b; }
        .badge-info { background: #dbeafe; color: #1e40af; }
        .badge-neutral { background: #e2e8f0; color: #475569; }
        .badge-purple { background: #ede9fe; color: #7c3aed; }
        .badge-pink { background: #fce7f3; color: #db2777; }
        .badge-teal { background: #ccfbf1; color: #0d9488; }
        .badge-gold { background: #fef3c7; color: #92400e; }

        /* BUTTONS */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
            font-family: 'Inter', sans-serif;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: var(--white);
            box-shadow: 0 4px 16px rgba(79,70,229,0.2);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(79,70,229,0.3);
        }

        .btn-success {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: var(--white);
            box-shadow: 0 4px 16px rgba(34,197,94,0.2);
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(34,197,94,0.3);
        }

        .btn-danger {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: var(--white);
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(239,68,68,0.3);
        }

        .btn-warning {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: var(--white);
        }

        .btn-warning:hover {
            transform: translateY(-2px);
        }

        .btn-outline {
            background: rgba(255,255,255,0.5);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(226, 232, 240, 0.5);
            color: var(--text);
        }

        .btn-outline:hover {
            background: var(--white);
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(0,0,0,0.06);
        }

        .btn-sm {
            padding: 6px 14px;
            font-size: 12px;
        }

        .btn-xs {
            padding: 4px 10px;
            font-size: 11px;
        }

        /* TOAST */
        .toast {
            position: fixed;
            top: 24px;
            right: 24px;
            padding: 16px 24px;
            border-radius: 12px;
            color: var(--white);
            font-weight: 500;
            font-size: 14px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.15);
            transform: translateX(120%);
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 9999;
            display: flex;
            align-items: center;
            gap: 12px;
            max-width: 420px;
        }

        .toast.show { transform: translateX(0); }
        .toast.success { background: linear-gradient(135deg, #22c55e, #16a34a); }
        .toast.error { background: linear-gradient(135deg, #ef4444, #dc2626); }
        .toast.info { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); }
        .toast.warning { background: linear-gradient(135deg, #f59e0b, #d97706); }

        .toast i { font-size: 20px; }

        /* MODAL */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(8px);
            z-index: 10000;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: var(--white);
            border-radius: var(--radius);
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 32px;
            box-shadow: 0 40px 100px rgba(0,0,0,0.3);
            animation: fadeIn 0.3s ease;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(226, 232, 240, 0.5);
        }

        .modal-header h3 {
            font-size: 22px;
            font-weight: 700;
        }

        .modal-header .close-btn {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: var(--text-light);
            transition: var(--transition);
            padding: 4px 8px;
            border-radius: 8px;
        }

        .modal-header .close-btn:hover {
            background: rgba(239,68,68,0.1);
            color: #ef4444;
        }

        .modal-body {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .modal-body .full-width {
            grid-column: 1 / -1;
        }

        .modal-body label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-light);
            margin-bottom: 4px;
        }

        .modal-body input,
        .modal-body select,
        .modal-body textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid rgba(226, 232, 240, 0.5);
            border-radius: 10px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            transition: var(--transition);
            background: var(--bg);
        }

        .modal-body input:focus,
        .modal-body select:focus,
        .modal-body textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79,70,229,0.1);
        }

        .modal-body textarea {
            resize: vertical;
            min-height: 60px;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid rgba(226, 232, 240, 0.5);
        }

        /* NAVIGATION */
        .nav-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid rgba(226, 232, 240, 0.3);
            flex-wrap: wrap;
        }

        .nav-links a {
            color: var(--text-light);
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 8px;
        }

        .nav-links a:hover {
            color: var(--primary);
            background: rgba(79,70,229,0.06);
            transform: translateY(-2px);
        }

        .nav-links a.active {
            color: var(--primary);
            background: rgba(79,70,229,0.1);
        }

        /* RESPONSIVE */
        @media (max-width: 1024px) {
            .modal-body {
                grid-template-columns: 1fr;
            }
            .book-grid {
                grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            }
        }

        @media (max-width: 768px) {
            .hero { padding: 12px; }
            
            .topbar-left .logo span,
            .topbar-left .logo small {
                display: none;
            }

            .topbar-left h1 small {
                display: none;
            }

            .page-header h2 {
                font-size: 22px;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .card {
                padding: 18px 16px;
            }

            .nav-links {
                flex-direction: column;
                align-items: center;
                gap: 8px;
            }

            .modal {
                padding: 20px;
                margin: 10px;
            }

            .breadcrumb {
                font-size: 12px;
                padding: 6px 12px;
            }

            .book-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
                gap: 12px;
            }

            .book-card .cover {
                height: 140px;
                font-size: 40px;
            }
        }

        @media (max-width: 480px) {
            .topbar-left h1 {
                font-size: 18px;
            }

            .topbar-right .icon-btn {
                padding: 6px 8px;
                font-size: 16px;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .book-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            }

            .book-card .title {
                font-size: 13px;
            }
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- TOAST -->
    <div class="toast" id="toast">
        <i class="fas fa-check-circle"></i>
        <span id="toastMessage">Успешно!</span>

    <!-- MODAL -->

    <!-- HERO -->
    <div class="hero">
        <div class="grid-bg"></div>

        <div class="container">
            
            <!-- TOPBAR -->
            <header class="topbar">
                <div class="topbar-left">
                    <a href="index.html" class="logo">
                        <i class="fas fa-graduation-cap"></i>
                        <span>UniSystem <small>v4.0</small></span>

                    <h1>
                        Библиотека

                <div class="topbar-right">

                    <button class="icon-btn" title="Закладки" onclick="showToast('info', 'Избранное')">
                        <i class="fas fa-star"></i>
                    </button>
                    <button class="icon-btn" title="История" onclick="showHistory()">
                        <i class="fas fa-clock"></i>
                    </button>
                    <button class="icon-btn" title="Тема" onclick="toggleTheme()">
                        <i class="fas fa-moon"></i>
                    </button>

                </div>
            </header>

            <!-- BREADCRUMBS -->
            <nav class="breadcrumb">
                <a href="index.html"><i class="fas fa-home"></i></a>
                <span class="separator">/</span>

            <!-- GLOBAL SEARCH -->
            <div class="global-search">
                <input type="text" id="globalSearch" placeholder="🔍 Поиск по названию, автору, ISBN, издательству..." oninput="applyFilters()" />
                <select id="categoryFilter" onchange="applyFilters()">
                    <option value="">Все категории</option>
                    <option value="Программирование">Программирование</option>
                    <option value="Математика">Математика</option>
                    <option value="Физика">Физика</option>
                    <option value="Экономика">Экономика</option>
                    <option value="Юриспруденция">Юриспруденция</option>
                    <option value="Философия">Философия</option>
                    <option value="История">История</option>
                    <option value="Иностранные языки">Иностранные языки</option>
                    <option value="Художественная литература">Художественная литература</option>
                </select>
                <select id="statusFilter" onchange="applyFilters()">
                    <option value="">Все статусы</option>
                    <option value="В наличии">В наличии</option>
                    <option value="Выдана">Выдана</option>
                    <option value="Списана">Списана</option>
                </select>
            </div>

            <!-- STATS CARDS -->
            <div class="stats-grid">
                <div class="stat-card animate-fadeInUp" style="animation-delay:0.05s;">
                    <div class="icon blue"><i class="fas fa-book"></i></div>
                    <div class="info">
                        <h4 id="totalBooks">0</h4>
                        <p>Всего книг</p>
                    </div>
                </div>
                <div class="stat-card animate-fadeInUp" style="animation-delay:0.1s;">
                    <div class="icon green"><i class="fas fa-check-circle"></i></div>
                    <div class="info">
                        <h4 id="availableBooks">0</h4>
                        <p>В наличии</p>
                    </div>
                </div>
                <div class="stat-card animate-fadeInUp" style="animation-delay:0.15s;">
                    <div class="icon orange"><i class="fas fa-clock"></i></div>
                    <div class="info">
                        <h4 id="borrowedBooks">0</h4>
                        <p>Выдано</p>
                    </div>
                </div>
                <div class="stat-card animate-fadeInUp" style="animation-delay:0.2s;">
                    <div class="icon purple"><i class="fas fa-users"></i></div>
                    <div class="info">

            <!-- QUICK FILTERS -->
            <div class="quick-filters animate-fadeInUp" style="animation-delay:0.25s;">
                <button class="filter-btn active" data-filter="all" onclick="setFilter('all')">Все</button>
                <button class="filter-btn" data-filter="available" onclick="setFilter('available')">В наличии</button>
                <button class="filter-btn" data-filter="borrowed" onclick="setFilter('borrowed')">Выданы</button>
                <button class="filter-btn" data-filter="low-stock" onclick="setFilter('low-stock')">Осталось мало</button>
                <button class="filter-btn" data-filter="programming" onclick="setFilter('programming')">Программирование</button>
                <button class="filter-btn" data-filter="math" onclick="setFilter('math')">Математика</button>
            </div>

            <!-- PAGE HEADER -->
            <div class="page-header animate-fadeInUp" style="animation-delay:0.3s;">
                <h2>
                    <i class="fas fa-books"></i>
                    Книжный фонд
                </h2>
                <div class="actions">
                    <button class="btn btn-sm btn-outline" onclick="exportData('pdf')">
                        <i class="fas fa-file-pdf"></i> PDF
                    </button>
                    <button class="btn btn-sm btn-outline" onclick="exportData('excel')">
                        <i class="fas fa-file-excel"></i> Excel
                    </button>
                    <button class="btn btn-sm btn-outline" onclick="window.print()">
                        <i class="fas fa-print"></i> Печать
                    </button>
                    <button class="btn btn-sm btn-primary" onclick="showAddBook()">
                        <i class="fas fa-plus"></i> Добавить книгу
                    </button>

            <!-- BOOK GRID -->
            <div class="card animate-fadeInUp" style="animation-delay:0.35s;">
                <div class="card-header">
                    <h3><i class="fas fa-list"></i> Все книги</h3>
                    <span class="badge badge-info" id="bookCount">0 книг</span>

                <div class="book-grid" id="bookGrid">
                    <!-- Генерируется JavaScript -->
                </div>

            <!-- NAVIGATION -->
            <div class="nav-links">
                <a href="index.html"><i class="fas fa-home"></i> Главная</a>
                <a href="students.html"><i class="fas fa-user-graduate"></i> Студенты</a>
                <a href="teachers.html"><i class="fas fa-chalkboard-teacher"></i> Преподаватели</a>
                <a href="groups.html"><i class="fas fa-users"></i> Группы</a>
                
                <a href="grades.html"><i class="fas fa-chart-line"></i> Оценки</a>
                <a href="schedule.html"><i class="fas fa-calendar-alt"></i> Расписание</a>
                <a href="library.html"><i class="fas fa-book"></i> Библиотека</a>
                <a href="profile.html"><i class="fas fa-user"></i> Профиль</a>
                <a href="settings.html"><i class="fas fa-cog"></i> Настройки</a>
                
                <a href="#" onclick="logout(event)" style="color: #ef4444;">
                    <i class="fas fa-sign-out-alt"></i> Выйти
                </a>
            </div>

        </div>
    </div>

    <script>
        // ============================================================
        // TOAST SYSTEM
        // ============================================================
        const toast = document.getElementById('toast');
        const toastMessage = document.getElementById('toastMessage');
        let toastTimeout = null;

        function showToast(type, message) {
            if (toastTimeout) {
                clearTimeout(toastTimeout);
                toast.classList.remove('show');
            }
            toast.className = 'toast';
            const icon = toast.querySelector('i');
            if (type === 'success') {
                toast.classList.add('success');
                icon.className = 'fas fa-check-circle';
            } else if (type === 'error') {
                toast.classList.add('error');
                icon.className = 'fas fa-exclamation-circle';
            } else if (type === 'warning') {
                toast.classList.add('warning');
                icon.className = 'fas fa-triangle-exclamation';
            } else {
                toast.classList.add('info');
                icon.className = 'fas fa-info-circle';
            }
            toastMessage.textContent = message;
            toast.classList.add('show');
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 4000);
        }

        toast.addEventListener('click', function() {
            this.classList.remove('show');
            if (toastTimeout) {
                clearTimeout(toastTimeout);
                toastTimeout = null;
            }
        });

        // ============================================================
        // AUTH CHECK
        // ============================================================
        (function() {
            const isAuth = localStorage.getItem('isAuthenticated');
            const user = JSON.parse(localStorage.getItem('user') || '{}');
            if (isAuth !== 'true' || !user.email) {
                showToast('error', 'Пожалуйста, войдите в систему');
                setTimeout(() => { window.location.href = 'login.html'; }, 1500);
                return;
            }
            const name = user.name || 'Пользователь';
            const initials = name.split(' ').map(n => n[0]).join('').toUpperCase();
            document.getElementById('userAvatar').textContent = initials || 'АИ';
        })();

        // ============================================================
        // LOGOUT
        // ============================================================
        function logout(e) {
            e.preventDefault();
            if (confirm('Вы уверены, что хотите выйти?')) {
                localStorage.removeItem('isAuthenticated');
                localStorage.removeItem('user');
                showToast('success', 'Вы успешно вышли');
                setTimeout(() => { window.location.href = 'login.html'; }, 1000);
            }
        }

        // ============================================================
        // THEME TOGGLE
        // ============================================================
        let isDark = false;

        function toggleTheme() {
            isDark = !isDark;
            const root = document.documentElement;
            const btn = document.querySelector('.topbar-right .icon-btn[title="Тема"] i');
            if (isDark) {
                root.style.setProperty('--bg', '#0f172a');
                root.style.setProperty('--text', '#f8fafc');
                root.style.setProperty('--text-light', '#94a3b8');
                root.style.setProperty('--white', '#1e293b');
                root.style.setProperty('--shadow', '0 20px 60px rgba(0,0,0,0.4)');
                btn.className = 'fas fa-sun';
                showToast('info', 'Тёмная тема включена');
            } else {
                root.style.setProperty('--bg', '#f8fafc');
                root.style.setProperty('--text', '#0f172a');
                root.style.setProperty('--text-light', '#475569');
                root.style.setProperty('--white', '#ffffff');
                root.style.setProperty('--shadow', '0 20px 60px rgba(0,0,0,0.08)');
                btn.className = 'fas fa-moon';
                showToast('info', 'Светлая тема включена');
            }
        }

        // ============================================================
        // BOOKS DATA
        // ============================================================
        let booksData = [];
        let currentBooks = [];
        let currentFilter = 'all';
        let editId = null;

        const coverEmojis = ['📚', '📖', '📕', '📗', '📘', '📙', '📓', '📒', '📔', '📰'];

        // Загрузка данных
        function loadBooks() {
            try {
                const saved = localStorage.getItem('booksData');
                if (saved) {
                    booksData = JSON.parse(saved);
                } else {
                    // Начальные данные
                    booksData = [
                        { id: 1, cover: '📚', title: 'JavaScript: Полное руководство', author: 'Дэвид Флэнаган', isbn: '978-5-9908910-5-4', category: 'Программирование', publisher: 'ООО "БХВ-Петербург"', year: 2021, copies: 5, available: 3, status: 'В наличии' },
                        { id: 2, cover: '📖', title: 'Введение в алгоритмы', author: 'Томас Кормен', isbn: '978-5-8459-2010-4', category: 'Программирование', publisher: 'ООО "И.Д. Вильямс"', year: 2019, copies: 3, available: 1, status: 'В наличии' },
                        { id: 3, cover: '📕', title: 'Математический анализ', author: 'В.А. Ильин, Э.Г. Позняк', isbn: '978-5-94727-123-4', category: 'Математика', publisher: 'Издательство МГУ', year: 2020, copies: 4, available: 4, status: 'В наличии' },
                        { id: 4, cover: '📗', title: 'Физика для программистов', author: 'Э.Н. Смирнов', isbn: '978-5-9901234-5-6', category: 'Физика', publisher: 'ООО "Техносфера"', year: 2022, copies: 2, available: 0, status: 'Выдана' },
                        { id: 5, cover: '📘', title: 'Экономическая теория', author: 'А.С. Булатов', isbn: '978-5-16-012345-6', category: 'Экономика', publisher: 'Издательство Юрайт', year: 2021, copies: 6, available: 4, status: 'В наличии' },
                        { id: 6, cover: '📙', title: 'Гражданское право', author: 'Е.А. Суханов', isbn: '978-5-392-12345-6', category: 'Юриспруденция', publisher: 'Издательство Статут', year: 2020, copies: 3, available: 1, status: 'В наличии' },
                        { id: 7, cover: '📓', title: 'Философия науки', author: 'П.П. Гайденко', isbn: '978-5-02-123456-7', category: 'Философия', publisher: 'Наука', year: 2019, copies: 2, available: 2, status: 'В наличии' },
                        { id: 8, cover: '📒', title: 'История Казахстана', author: 'К.А. Акишев', isbn: '978-601-234-567-8', category: 'История', publisher: 'Атамұра', year: 2022, copies: 4, available: 3, status: 'В наличии' },
                        { id: 9, cover: '📔', title: 'Английский язык B2', author: 'М.В. Вербицкая', isbn: '978-5-09-123456-7', category: 'Иностранные языки', publisher: 'Просвещение', year: 2021, copies: 5, available: 2, status: 'В наличии' },
                        { id: 10, cover: '📰', title: 'Война и мир', author: 'Л.Н. Толстой', isbn: '978-5-17-123456-7', category: 'Художественная литература', publisher: 'АСТ', year: 2018, copies: 7, available: 5, status: 'В наличии' },
                        { id: 11, cover: '📚', title: 'Clean Code', author: 'Роберт Мартин', isbn: '978-5-8459-1956-4', category: 'Программирование', publisher: 'ООО "И.Д. Вильямс"', year: 2020, copies: 3, available: 0, status: 'Выдана' },
                        { id: 12, cover: '📖', title: 'Линейная алгебра', author: 'А.Н. Колмогоров', isbn: '978-5-06-123456-7', category: 'Математика', publisher: 'Наука', year: 2019, copies: 4, available: 1, status: 'В наличии' }
                    ];
                    saveBooks();
                }
                currentBooks = [...booksData];
                renderBooks(currentBooks);
                updateStats();
            } catch (e) {
                console.warn('Ошибка загрузки данных:', e);
                booksData = [];
                currentBooks = [];
                renderBooks([]);
            }
        }

        function saveBooks() {
            try {
                localStorage.setItem('booksData', JSON.stringify(booksData));
                // Обновляем счетчик на главной
                localStorage.setItem('booksCount', JSON.stringify(booksData.length));
            } catch (e) {
                console.warn('Не удалось сохранить данные:', e);
            }
        }

        // ============================================================
        // RENDER BOOKS
        // ============================================================
        function renderBooks(books) {
            const grid = document.getElementById('bookGrid');
            if (!books || books.length === 0) {
                grid.innerHTML = `
                    <div style="grid-column: 1 / -1; text-align:center; padding: 40px;">
                        <div style="font-size: 48px; color: #c7d2fe;">📚</div>
                        <p style="color: var(--text-light); margin-top: 8px;">Книги не найдены</p>
                        <button class="btn btn-primary btn-sm" style="margin-top: 12px;" onclick="showAddBook()">
                            <i class="fas fa-plus"></i> Добавить книгу
                        </button>
                    </div>
                `;
                document.getElementById('bookCount').textContent = '0 книг';
                return;
            }

            grid.innerHTML = books.map(b => `
                <div class="book-card" data-id="${b.id}">
                    <div class="cover">
                        ${b.cover || '📚'}
                        <span class="status-badge">${getStatusBadge(b.status)}</span>
                    </div>
                    <div class="title">${b.title}</div>
                    <div class="author"><i class="fas fa-user-edit"></i> ${b.author}</div>
                    <div class="isbn">ISBN: ${b.isbn}</div>
                    <div class="meta">
                        <span class="badge badge-info">${b.category}</span>
                        <span class="badge badge-neutral">${b.publisher}</span>
                        <span class="badge badge-neutral">${b.year}</span>
                    </div>
                    <div class="stock">
                        <div class="count">
                            <span>Всего: ${b.copies}</span>
                        </div>
                        <div class="count" style="color: ${b.available > 0 ? 'var(--success)' : 'var(--danger)'}">
                            <span>Осталось: ${b.available}</span>
                        </div>
                    </div>
                    <div class="actions">
                        <button class="btn btn-sm btn-outline" onclick="viewBook(${b.id})" title="Просмотр">
                            <i class="fas fa-eye"></i>
                        </button>
                        <button class="btn btn-sm btn-outline" onclick="editBook(${b.id})" title="Редактировать">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button class="btn btn-sm btn-outline" onclick="generateQR(${b.id})" title="QR-код">
                            <i class="fas fa-qrcode"></i>
                        </button>
                        <button class="btn btn-sm btn-danger" onclick="deleteBook(${b.id})" title="Удалить">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                </div>
            `).join('');

            document.getElementById('bookCount').textContent = `${books.length} книг`;
        }

        function getStatusBadge(status) {
            const map = {
                'В наличии': 'badge-success',
                'Выдана': 'badge-warning',
                'Списана': 'badge-danger'
            };
            return `<span class="badge ${map[status] || 'badge-neutral'}">${status}</span>`;
        }

        // ============================================================
        // STATS
        // ============================================================
        function updateStats() {
            const total = booksData.length;
            document.getElementById('totalBooks').textContent = total;

            const available = booksData.filter(b => b.status === 'В наличии' && b.available > 0).length;
            document.getElementById('availableBooks').textContent = available;

            const borrowed = booksData.filter(b => b.status === 'Выдана').length;
            document.getElementById('borrowedBooks').textContent = borrowed;

            // Уникальные читатели (имитация)
            document.getElementById('totalReaders').textContent = Math.floor(total * 0.7);
        }

        // ============================================================
        // FILTERS
        // ============================================================
        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.quick-filters .filter-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.filter === filter);
            });
            applyFilters();
        }

        function applyFilters() {
            let filtered = [...booksData];

            const search = document.getElementById('globalSearch').value.toLowerCase();
            if (search) {
                filtered = filtered.filter(b => 
                    b.title.toLowerCase().includes(search) ||
                    b.author.toLowerCase().includes(search) ||
                    b.isbn.includes(search) ||
                    b.publisher.toLowerCase().includes(search) ||
                    b.category.toLowerCase().includes(search)
                );
            }

            const category = document.getElementById('categoryFilter').value;
            if (category) {
                filtered = filtered.filter(b => b.category === category);
            }

            const status = document.getElementById('statusFilter').value;
            if (status) {
                filtered = filtered.filter(b => b.status === status);
            }

            if (currentFilter === 'available') {
                filtered = filtered.filter(b => b.status === 'В наличии' && b.available > 0);
            } else if (currentFilter === 'borrowed') {
                filtered = filtered.filter(b => b.status === 'Выдана' || b.available === 0);
            } else if (currentFilter === 'low-stock') {
                filtered = filtered.filter(b => b.available > 0 && b.available <= 1);
            } else if (currentFilter === 'programming') {
                filtered = filtered.filter(b => b.category === 'Программирование');
            } else if (currentFilter === 'math') {
                filtered = filtered.filter(b => b.category === 'Математика');
            }

            currentBooks = filtered;
            renderBooks(filtered);
        }

        // ============================================================
        // ADD BOOK
        // ============================================================
        function showAddBook() {
            const content = `
                <div class="full-width"><label>Обложка (эмодзи)</label>
                    <select id="bookCover">
                        ${coverEmojis.map(e => `<option value="${e}">${e}</option>`).join('')}
                    </select>
                </div>
                <div class="full-width"><label>Название книги *</label><input id="bookTitle" placeholder="Введите название" /></div>
                <div class="full-width"><label>Автор *</label><input id="bookAuthor" placeholder="Введите автора" /></div>
                <div><label>ISBN</label><input id="bookIsbn" placeholder="978-5-000-00000-0" /></div>
                <div><label>Категория</label>
                    <select id="bookCategory">
                        <option>Программирование</option><option>Математика</option>
                        <option>Физика</option><option>Экономика</option>
                        <option>Юриспруденция</option><option>Философия</option>
                        <option>История</option><option>Иностранные языки</option>
                        <option>Художественная литература</option>
                    </select>
                </div>
                <div><label>Издательство</label><input id="bookPublisher" placeholder="Издательство" /></div>
                <div><label>Год выпуска</label><input id="bookYear" type="number" value="2024" placeholder="2024" /></div>
                <div><label>Количество экземпляров</label><input id="bookCopies" type="number" value="1" min="1" /></div>
                <div><label>Статус</label>
                    <select id="bookStatus">
                        <option value="В наличии">В наличии</option>
                        <option value="Выдана">Выдана</option>
                        <option value="Списана">Списана</option>
                    </select>
                </div>
            `;

            editId = null;
            document.getElementById('modalTitle').innerHTML = '<i class="fas fa-plus"></i> Добавление книги';
            document.getElementById('modalBody').innerHTML = content;
            document.getElementById('modalOverlay').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        // ============================================================
        // EDIT BOOK
        // ============================================================
        function editBook(id) {
            const book = booksData.find(b => b.id === id);
            if (!book) return;

            const content = `
                <div class="full-width"><label>Обложка (эмодзи)</label>
                    <select id="bookCover">
                        ${coverEmojis.map(e => `<option value="${e}" ${e === book.cover ? 'selected' : ''}>${e}</option>`).join('')}
                    </select>
                </div>
                <div class="full-width"><label>Название книги *</label><input id="bookTitle" value="${book.title}" /></div>
                <div class="full-width"><label>Автор *</label><input id="bookAuthor" value="${book.author}" /></div>
                <div><label>ISBN</label><input id="bookIsbn" value="${book.isbn}" /></div>
                <div><label>Категория</label>
                    <select id="bookCategory">
                        ${['Программирование','Математика','Физика','Экономика','Юриспруденция','Философия','История','Иностранные языки','Художественная литература']
                            .map(c => `<option ${c === book.category ? 'selected' : ''}>${c}</option>`).join('')}
                    </select>
                </div>
                <div><label>Издательство</label><input id="bookPublisher" value="${book.publisher}" /></div>
                <div><label>Год выпуска</label><input id="bookYear" type="number" value="${book.year}" /></div>
                <div><label>Количество экземпляров</label><input id="bookCopies" type="number" value="${book.copies}" min="1" /></div>
                <div><label>Статус</label>
                    <select id="bookStatus">
                        <option value="В наличии" ${book.status === 'В наличии' ? 'selected' : ''}>В наличии</option>
                        <option value="Выдана" ${book.status === 'Выдана' ? 'selected' : ''}>Выдана</option>
                        <option value="Списана" ${book.status === 'Списана' ? 'selected' : ''}>Списана</option>
                    </select>
                </div>
            `;

            editId = id;
            document.getElementById('modalTitle').innerHTML = '<i class="fas fa-edit"></i> Редактирование книги';
            document.getElementById('modalBody').innerHTML = content;
            document.getElementById('modalOverlay').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        // ============================================================
        // SAVE BOOK
        // ============================================================
        function saveBook() {
            const cover = document.getElementById('bookCover').value;
            const title = document.getElementById('bookTitle').value.trim();
            const author = document.getElementById('bookAuthor').value.trim();
            const isbn = document.getElementById('bookIsbn').value.trim();
            const category = document.getElementById('bookCategory').value;
            const publisher = document.getElementById('bookPublisher').value.trim();
            const year = parseInt(document.getElementById('bookYear').value) || 2024;
            const copies = parseInt(document.getElementById('bookCopies').value) || 1;
            const status = document.getElementById('bookStatus').value;

            if (!title || !author) {
                showToast('error', 'Заполните обязательные поля (Название и Автор)');
                return;
            }

            const available = status === 'В наличии' ? copies : status === 'Выдана' ? Math.max(0, copies - 1) : 0;

            const bookData = {
                id: editId || Date.now(),
                cover: cover || '📚',
                title,
                author,
                isbn: isbn || 'Не указан',
                category,
                publisher: publisher || 'Не указано',
                year,
                copies,
                available,
                status
            };

            if (editId) {
                const index = booksData.findIndex(b => b.id === editId);
                if (index !== -1) {
                    booksData[index] = bookData;
                    showToast('success', 'Книга обновлена');
                    addHistory('Обновление книги', title);
                }
            } else {
                booksData.push(bookData);
                showToast('success', 'Книга добавлена');
                addHistory('Добавление книги', title);
            }

            saveBooks();
            closeModal();
            currentBooks = [...booksData];
            applyFilters();
            updateStats();
        }

        // ============================================================
        // DELETE BOOK
        // ============================================================
        function deleteBook(id) {
            if (!confirm('Вы уверены, что хотите удалить эту книгу?')) return;
            
            const book = booksData.find(b => b.id === id);
            if (!book) return;
            
            booksData = booksData.filter(b => b.id !== id);
            saveBooks();
            currentBooks = [...booksData];
            applyFilters();
            updateStats();
            showToast('success', `Книга "${book.title}" удалена`);
            addHistory('Удаление книги', book.title);
        }

        // ============================================================
        // VIEW BOOK
        // ============================================================
        function viewBook(id) {
            const book = booksData.find(b => b.id === id);
            if (!book) return;

            const content = `
                <div class="full-width" style="text-align:center; padding: 20px; background: var(--primary-bg); border-radius: 12px;">
                    <div style="font-size: 72px;">${book.cover || '📚'}</div>
                    <h3 style="margin-top: 8px;">${book.title}</h3>
                    <p style="color: var(--text-light);"><i class="fas fa-user-edit"></i> ${book.author}</p>
                </div>
                <div><label>ISBN</label><input value="${book.isbn}" readonly /></div>
                <div><label>Категория</label><input value="${book.category}" readonly /></div>
                <div><label>Издательство</label><input value="${book.publisher}" readonly /></div>
                <div><label>Год выпуска</label><input value="${book.year}" readonly /></div>
                <div><label>Всего экземпляров</label><input value="${book.copies}" readonly /></div>
                <div><label>Осталось</label><input value="${book.available}" readonly /></div>
                <div><label>Статус</label><input value="${book.status}" readonly /></div>
                <div class="full-width" style="display: flex; gap: 12px; flex-wrap: wrap;">
                    <button class="btn btn-sm btn-primary" onclick="generateQR(${book.id})">
                        <i class="fas fa-qrcode"></i> QR-код
                    </button>
                    <button class="btn btn-sm btn-success" onclick="showToast('success', 'Справка формируется...')">
                        <i class="fas fa-file-alt"></i> Справка
                    </button>
                    <button class="btn btn-sm btn-outline" onclick="window.print()">
                        <i class="fas fa-print"></i> Печать
                    </button>
                </div>
            `;

            openModal(`📖 ${book.title}`, content);
        }

        // ============================================================
        // GENERATE QR
        // ============================================================
        function generateQR(id) {
            const book = booksData.find(b => b.id === id);
            if (!book) return;

            const content = `
                <div class="full-width" style="text-align: center;">
                    <h4 style="margin-bottom: 16px;">QR-код книги</h4>
                    <div style="display: flex; flex-direction: column; align-items: center; padding: 30px; background: var(--bg); border-radius: 12px; border: 2px dashed rgba(226,232,240,0.5);">
                        <div style="font-size: 80px; color: var(--primary-light);">📱</div>
                        <div style="margin-top: 16px; font-size: 14px; color: var(--text-light);">
                            <strong>${book.title}</strong><br>
                            ${book.author}<br>
                            ISBN: ${book.isbn}
                        </div>
                        <div style="margin-top: 12px; display: flex; gap: 12px;">
                            <button class="btn btn-sm btn-primary" onclick="showToast('success', 'QR-код скачан')">
                                <i class="fas fa-download"></i> Скачать
                            </button>
                            <button class="btn btn-sm btn-outline" onclick="window.print()">
                                <i class="fas fa-print"></i> Печать
                            </button>
                        </div>
                    </div>
                </div>
            `;

            openModal('📱 QR-код книги', content);
        }

        // ============================================================
        // EXPORT
        // ============================================================
        function exportData(type) {
            showToast('success', `📊 Экспорт ${type.toUpperCase()} (${currentBooks.length} книг) начат`);
            addHistory('Экспорт данных', `${type.toUpperCase()} - ${currentBooks.length} книг`);
        }

        // ============================================================
        // HISTORY
        // ============================================================
        let historyData = [];

        function addHistory(action, target) {
            const entry = {
                time: new Date().toLocaleString(),
                action: action,
                target: target,
                user: localStorage.getItem('user') ? JSON.parse(localStorage.getItem('user')).name || 'Пользователь' : 'Пользователь'
            };
            historyData.unshift(entry);
            if (historyData.length > 50) historyData.pop();
            localStorage.setItem('historyLibrary', JSON.stringify(historyData));
        }

        function showHistory() {
            const saved = localStorage.getItem('historyLibrary');
            if (saved) historyData = JSON.parse(saved);

            const content = `
                <div class="full-width">
                    <h4 style="margin-bottom: 12px;">📋 История действий</h4>
                    <div style="max-height: 300px; overflow-y: auto;">
                        ${historyData.length === 0 ? `
                            <p style="color: var(--text-light); text-align: center; padding: 20px;">История пуста</p>
                        ` : historyData.map(h => `
                            <div style="display: flex; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid rgba(226,232,240,0.3); font-size: 13px;">
                                <span style="color: var(--text-light); font-size: 12px; min-width: 80px;">${h.time}</span>
                                <span style="flex: 1;">${h.action}: <strong>${h.target}</strong></span>
                                <span style="color: var(--primary); font-weight: 500;">${h.user}</span>
                            </div>
                        `).join('')}
                    </div>
                    ${historyData.length > 0 ? `
                        <div style="margin-top: 12px; text-align: right;">
                            <button class="btn btn-sm btn-danger" onclick="clearHistoryLibrary()">Очистить историю</button>
                        </div>
                    ` : ''}
                </div>
            `;

            openModal('📋 История действий', content);
        }

        function clearHistoryLibrary() {
            if (confirm('Очистить всю историю?')) {
                historyData = [];
                localStorage.setItem('historyLibrary', JSON.stringify(historyData));
                showToast('success', 'История очищена');
                closeModal();
            }
        }

        // ============================================================
        // MODAL
        // ============================================================
        function openModal(title, content) {
            document.getElementById('modalTitle').innerHTML = title;
            document.getElementById('modalBody').innerHTML = content;
            document.getElementById('modalOverlay').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
            document.body.style.overflow = '';
            editId = null;
        }

        document.getElementById('modalOverlay').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeModal();
        });

        // ============================================================
        // INIT
        // ============================================================
        const savedHistory = localStorage.getItem('historyLibrary');
        if (savedHistory) historyData = JSON.parse(savedHistory);

        loadBooks();
        addHistory('Загрузка страницы', 'Библиотека');

        console.log('✅ Страница библиотеки загружена');
        console.log(`📚 Всего книг: ${booksData.length}`);
        console.log('💡 Данные синхронизируются через localStorage');
    </script>
</body>
</html>
