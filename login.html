<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Вход | University Management System</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #4f46e5;
            --primary-dark: #4338ca;
            --primary-light: #818cf8;
            --primary-bg: #eef2ff;
            --bg: #f1f5f9;
            --text: #0f172a;
            --text-light: #475569;
            --white: #ffffff;
            --shadow: 0 20px 60px rgba(0,0,0,0.08);
            --radius: 20px;
            --transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: linear-gradient(135deg, #eef2ff 0%, #e0e7ff 50%, #c7d2fe 100%);
        }

        /* ============================================================
           ANIMATIONS
           ============================================================ */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(30px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .animate-fadeInUp { animation: fadeInUp 0.6s ease forwards; }
        .animate-fadeIn { animation: fadeIn 0.6s ease forwards; }
        .animate-slideInRight { animation: slideInRight 0.6s ease forwards; }

        /* ============================================================
           CONTAINER
           ============================================================ */
        .container {
            max-width: 480px;
            width: 100%;
            animation: fadeInUp 0.6s ease forwards;
        }

        /* ============================================================
           LOGO
           ============================================================ */
        .logo {
            text-align: center;
            margin-bottom: 32px;
            animation: fadeIn 0.8s ease forwards;
        }

        .logo a {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: var(--text);
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .logo a i {
            font-size: 32px;
            color: var(--primary);
            background: var(--primary-bg);
            padding: 12px;
            border-radius: 14px;
        }

        .logo a span { color: var(--text); }
        .logo a small { font-size: 16px; font-weight: 400; color: var(--text-light); }

        /* ============================================================
           CARD
           ============================================================ */
        .card {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(20px);
            border-radius: var(--radius);
            padding: 40px 36px;
            border: 1px solid rgba(255,255,255,0.5);
            box-shadow: var(--shadow);
            transition: var(--transition);
            animation: slideInRight 0.6s ease forwards;
        }

        .card:hover {
            box-shadow: 0 30px 80px rgba(79,70,229,0.12);
            transform: translateY(-2px);
        }

        /* ============================================================
           HEADER
           ============================================================ */
        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .header .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--text-light);
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 16px;
            transition: var(--transition);
        }

        .header .back-link:hover {
            color: var(--primary);
        }

        .header h2 {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 6px;
            letter-spacing: -0.5px;
        }

        .header p {
            color: var(--text-light);
            font-size: 14px;
        }

        /* ============================================================
           ROLE INDICATOR
           ============================================================ */
        .role-indicator {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 16px 6px 12px;
            background: var(--primary-bg);
            border-radius: 50px;
            font-size: 13px;
            font-weight: 600;
            color: var(--primary);
            margin-top: 4px;
            border: 1px solid rgba(79,70,229,0.15);
        }

        .role-indicator i { font-size: 14px; }

        /* ============================================================
           FORM
           ============================================================ */
        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 5px;
            color: var(--text);
        }

        .form-group label .required {
            color: #ef4444;
            margin-left: 2px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper .icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 16px;
            transition: var(--transition);
            pointer-events: none;
        }

        .input-wrapper input {
            width: 100%;
            padding: 12px 16px 12px 46px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            background: var(--white);
            transition: var(--transition);
            color: var(--text);
        }

        .input-wrapper input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(79,70,229,0.08);
        }

        .input-wrapper input:focus + .icon { color: var(--primary); }
        .input-wrapper input::placeholder { color: #94a3b8; }

        .input-wrapper .toggle-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            font-size: 16px;
            padding: 4px;
            transition: var(--transition);
        }

        .input-wrapper .toggle-password:hover { color: var(--text); }

        /* ============================================================
           FORM OPTIONS
           ============================================================ */
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            font-size: 13px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .form-options label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            color: var(--text-light);
            font-weight: 500;
        }

        .form-options label input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--primary);
            cursor: pointer;
        }

        .form-options a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            transition: var(--transition);
        }

        .form-options a:hover {
            color: var(--primary-dark);
            text-decoration: underline;
        }

        /* ============================================================
           BUTTONS
           ============================================================ */
        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: var(--white);
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .btn-primary::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
            transition: 0.5s;
        }

        .btn-primary:hover::before { left: 100%; }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(79,70,229,0.3);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-primary i { margin-right: 8px; }

        /* ============================================================
           DIVIDER
           ============================================================ */
        .divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 24px 0;
            color: var(--text-light);
            font-size: 13px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e2e8f0;
        }

        /* ============================================================
           SOCIAL BUTTONS
           ============================================================ */
        .social-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn-social {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            background: var(--white);
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            color: var(--text);
            transition: var(--transition);
        }

        .btn-social:hover {
            border-color: var(--primary-light);
            background: var(--primary-bg);
            transform: translateY(-2px);
        }

        .btn-social i { font-size: 20px; }
        .btn-social .fa-google { color: #ea4335; }
        .btn-social .fa-github { color: #181717; }

        /* ============================================================
           REGISTER LINK
           ============================================================ */
        .register-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: var(--text-light);
        }

        .register-link a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 700;
            transition: var(--transition);
        }

        .register-link a:hover {
            color: var(--primary-dark);
            text-decoration: underline;
        }

        /* ============================================================
           DEMO CREDENTIALS
           ============================================================ */
        .demo-box {
            margin-top: 20px;
            padding: 14px 18px;
            background: var(--primary-bg);
            border-radius: 12px;
            border: 1px solid rgba(79,70,229,0.15);
        }

        .demo-box p {
            font-size: 12px;
            color: var(--text-light);
            margin: 0 0 6px 0;
            font-weight: 600;
        }

        .demo-box .demo-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px 16px;
        }

        .demo-box .demo-item {
            font-size: 12px;
            color: var(--text);
            display: flex;
            justify-content: space-between;
            gap: 8px;
            padding: 2px 0;
        }

        .demo-box .demo-item .email {
            font-weight: 500;
            color: var(--text-light);
        }

        .demo-box .demo-item .pass {
            color: var(--primary);
            font-weight: 600;
        }

        /* ============================================================
           TOAST
           ============================================================ */
        .toast {
            position: fixed;
            top: 24px;
            right: 24px;
            padding: 16px 24px;
            border-radius: 12px;
            color: var(--white);
            font-weight: 500;
            font-size: 14px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.15);
            transform: translateX(120%);
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 9999;
            display: flex;
            align-items: center;
            gap: 12px;
            max-width: 420px;
        }

        .toast.show { transform: translateX(0); }
        .toast.success { background: linear-gradient(135deg, #22c55e, #16a34a); }
        .toast.error { background: linear-gradient(135deg, #ef4444, #dc2626); }
        .toast.info { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); }

        .toast i { font-size: 20px; }

        /* ============================================================
           SPINNER
           ============================================================ */
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: var(--white);
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
        }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 520px) {
            .card { padding: 28px 20px; }
            .social-buttons { grid-template-columns: 1fr; }
            .demo-box .demo-grid { grid-template-columns: 1fr; }
            .form-options { flex-direction: column; align-items: flex-start; }
            .header h2 { font-size: 24px; }
            .logo a { font-size: 24px; }
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- ============================================================
    TOAST
    ============================================================ -->
    <div class="toast" id="toast">
        <i class="fas fa-check-circle"></i>
        <span id="toastMessage">Успешно!</span>
    </div>

    <!-- ============================================================
    CONTAINER
    ============================================================ -->
    <div class="container">
        
        <!-- LOGO -->
        <div class="logo">
            <a href="index.html">
                <i class="fas fa-graduation-cap"></i>
                <span>UniSystem <small>Вход</small></span>
            </a>
        </div>

        <!-- CARD -->
        <div class="card">
            
            <!-- HEADER -->
            <div class="header">
                <a href="index.html" class="back-link">
                    <i class="fas fa-arrow-left"></i> На главную
                </a>
                <h2>Вход в систему</h2>
                <p>Войдите в свою учетную запись</p>
                <div class="role-indicator" id="roleIndicator">
                    <i class="fas fa-user-graduate"></i>
                    <span id="roleDisplay">Студент</span>
                </div>
            </div>

            <!-- LOGIN FORM -->
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="email">Email <span class="required">*</span></label>
                    <div class="input-wrapper">
                        <input type="email" id="email" placeholder="your@email.com" required autocomplete="email" />
                        <i class="fas fa-envelope icon"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Пароль <span class="required">*</span></label>
                    <div class="input-wrapper">
                        <input type="password" id="password" placeholder="••••••••" required minlength="6" autocomplete="current-password" />
                        <i class="fas fa-lock icon"></i>
                        <button type="button" class="toggle-password" onclick="togglePasswordVisibility()">
                            <i class="fas fa-eye" id="passwordToggleIcon"></i>
                        </button>
                    </div>
                </div>

                <div class="form-options">
                    <label>
                        <input type="checkbox" id="rememberMe" checked />
                        Запомнить меня
                    </label>
                    <a href="forgot-password.html" onclick="event.preventDefault(); showToast('info', 'Ссылка для восстановления отправлена на ваш email')">
                        Забыли пароль?
                    </a>
                </div>

                <button type="submit" class="btn-primary" id="loginBtn">
                    <i class="fas fa-sign-in-alt"></i>
                    <span id="loginBtnText">Войти</span>
                </button>
            </form>

            <div class="divider">или</div>

            <!-- SOCIAL BUTTONS -->
            <div class="social-buttons">
                <button class="btn-social" onclick="showToast('info', 'Вход через Google (демо-режим)')">
                    <i class="fab fa-google"></i> Google
                </button>
                <button class="btn-social" onclick="showToast('info', 'Вход через GitHub (демо-режим)')">
                    <i class="fab fa-github"></i> GitHub
                </button>
            </div>

            <!-- REGISTER LINK -->
            <div class="register-link">
                Нет аккаунта? <a href="register.html">Зарегистрироваться</a>
            </div>

            <!-- DEMO CREDENTIALS -->
            <div class="demo-box">
                <p>🔑 Демо-доступ (нажмите для автозаполнения)</p>
                <div class="demo-grid">
                    <div class="demo-item" onclick="fillCredentials('student@uni.ru', 'student123')" style="cursor:pointer;">
                        <span class="email">👨‍🎓 Студент</span>
                        <span class="pass">student123</span>
                    </div>
                    <div class="demo-item" onclick="fillCredentials('teacher@uni.ru', 'teacher123')" style="cursor:pointer;">
                        <span class="email">👨‍🏫 Преподаватель</span>
                        <span class="pass">teacher123</span>
                    </div>
                    <div class="demo-item" onclick="fillCredentials('admin@uni.ru', 'admin123')" style="cursor:pointer;">
                        <span class="email">🛡️ Администратор</span>
                        <span class="pass">admin123</span>
                    </div>
                    <div class="demo-item" onclick="fillCredentials('manager@uni.ru', 'manager123')" style="cursor:pointer;">
                        <span class="email">👔 Менеджер</span>
                        <span class="pass">manager123</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ============================================================
    JAVASCRIPT - ПОЛНАЯ ЛОГИКА
    ============================================================ -->
    <script>
        /**
         * ============================================================
         * UNIVERSITY MANAGEMENT SYSTEM - LOGIN PAGE
         * ============================================================
         * 
         * Полная логика страницы входа:
         * - Авторизация с валидацией
         * - Отображение выбранной роли
         * - Показ/скрытие пароля
         * - Автозаполнение демо-данными
         * - Переход на dashboard
         */

        // ============================================================
        // STATE
        // ============================================================
        const state = {
            isLoading: false
        };

        // ============================================================
        // DOM REFS
        // ============================================================
        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        const loginBtnText = document.getElementById('loginBtnText');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const rememberMe = document.getElementById('rememberMe');
        const toast = document.getElementById('toast');
        const toastMessage = document.getElementById('toastMessage');
        const roleDisplay = document.getElementById('roleDisplay');

        // ============================================================
        // INIT - GET ROLE FROM URL
        // ============================================================
        (function init() {
            const params = new URLSearchParams(window.location.search);
            const role = params.get('role') || 'student';
            
            const roleNames = {
                student: 'Студент',
                teacher: 'Преподаватель',
                admin: 'Администратор',
                manager: 'Менеджер',
                developer: 'Разработчик',
                accountant: 'Бухгалтер'
            };

            const icons = {
                student: 'fa-user-graduate',
                teacher: 'fa-chalkboard-teacher',
                admin: 'fa-user-shield',
                manager: 'fa-user-tie',
                developer: 'fa-code',
                accountant: 'fa-calculator'
            };

            roleDisplay.textContent = roleNames[role] || 'Студент';
            document.querySelector('#roleIndicator i').className = `fas ${icons[role] || 'fa-user-graduate'}`;
            
            // Сохраняем роль в localStorage для использования после входа
            localStorage.setItem('selectedRole', role);
        })();

        // ============================================================
        // TOGGLE PASSWORD
        // ============================================================
        function togglePasswordVisibility() {
            const input = document.getElementById('password');
            const icon = document.getElementById('passwordToggleIcon');
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'fas fa-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'fas fa-eye';
            }
        }

        // ============================================================
        // FILL CREDENTIALS
        // ============================================================
        function fillCredentials(email, password) {
            emailInput.value = email;
            passwordInput.value = password;
            showToast('success', 'Данные заполнены! Нажмите "Войти"');
            
            // Автоматически отправляем форму через секунду
            setTimeout(() => {
                loginForm.dispatchEvent(new Event('submit'));
            }, 500);
        }

        // ============================================================
        // HANDLE LOGIN
        // ============================================================
        async function handleLogin(e) {
            e.preventDefault();

            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();

            // Валидация
            if (!email || !password) {
                showToast('error', 'Пожалуйста, заполните все поля');
                return;
            }

            if (!email.includes('@') || !email.includes('.')) {
                showToast('error', 'Введите корректный email');
                return;
            }

            if (password.length < 6) {
                showToast('error', 'Пароль должен содержать минимум 6 символов');
                return;
            }

            setLoading(true);

            try {
                const role = localStorage.getItem('selectedRole') || 'student';
                const result = await simulateLogin(email, password, role);
                
                // Сохраняем данные
                const userData = {
                    ...result,
                    rememberMe: rememberMe.checked
                };
                localStorage.setItem('user', JSON.stringify(userData));
                localStorage.setItem('isAuthenticated', 'true');
                localStorage.setItem('userRole', role);
                
                if (rememberMe.checked) {
                    localStorage.setItem('rememberedEmail', email);
                } else {
                    localStorage.removeItem('rememberedEmail');
                }

                showToast('success', `Добро пожаловать, ${userData.name}!`);
                
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 800);
                
            } catch (error) {
                showToast('error', error.message || 'Ошибка входа. Проверьте данные.');
            } finally {
                setLoading(false);
            }
        }

        // ============================================================
        // SIMULATE LOGIN
        // ============================================================
        function simulateLogin(email, password, role) {
            return new Promise((resolve, reject) => {
                setTimeout(() => {
                    const validCredentials = {
                        'student@uni.ru': { pass: 'student123', name: 'Иван Студент' },
                        'teacher@uni.ru': { pass: 'teacher123', name: 'Алексей Преподаватель' },
                        'admin@uni.ru': { pass: 'admin123', name: 'Елена Администратор' },
                        'manager@uni.ru': { pass: 'manager123', name: 'Дмитрий Менеджер' },
                        'developer@uni.ru': { pass: 'dev123', name: 'Антон Разработчик' },
                        'accountant@uni.ru': { pass: 'acc123', name: 'Марина Бухгалтер' }
                    };

                    if (validCredentials[email] && validCredentials[email].pass === password) {
                        resolve({
                            email,
                            role,
                            name: validCredentials[email].name,
                            loginTime: new Date().toISOString()
                        });
                    } else if (email === 'demo@uni.ru' && password === 'demo123') {
                        resolve({
                            email,
                            role,
                            name: 'Демо Пользователь',
                            loginTime: new Date().toISOString()
                        });
                    } else {
                        reject(new Error('Неверный email или пароль'));
                    }
                }, 1200);
            });
        }

        // ============================================================
        // UI HELPERS
        // ============================================================
        function setLoading(loading) {
            state.isLoading = loading;
            if (loading) {
                loginBtn.disabled = true;
                loginBtnText.innerHTML = '<span class="spinner"></span> Вход...';
            } else {
                loginBtn.disabled = false;
                loginBtnText.innerHTML = '<i class="fas fa-sign-in-alt"></i> Войти';
            }
        }

        function showToast(type, message) {
            const icons = {
                success: 'fa-check-circle',
                error: 'fa-exclamation-circle',
                info: 'fa-info-circle'
            };

            toast.className = 'toast';
            toast.classList.add(type);
            toast.querySelector('i').className = `fas ${icons[type] || icons.info}`;
            toastMessage.textContent = message;
            toast.classList.add('show');

            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 4000);
        }

        // ============================================================
        // RESTORE REMEMBERED EMAIL
        // ============================================================
        (function restoreEmail() {
            const remembered = localStorage.getItem('rememberedEmail');
            if (remembered) {
                emailInput.value = remembered;
                rememberMe.checked = true;
            }
        })();

        // ============================================================
        // KEYBOARD SHORTCUTS
        // ============================================================
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && document.activeElement?.tagName === 'INPUT') {
                loginForm.dispatchEvent(new Event('submit'));
            }
        });

        console.log('🔐 Страница входа загружена');
        console.log('📌 Используйте демо-данные для входа');
    </script>

</body>
